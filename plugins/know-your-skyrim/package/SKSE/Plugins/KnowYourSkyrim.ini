; Know your Skyrim. The file is read again each time the inventory opens, a change holds without a restart of the game.
; The mod's menu in SkyUI (Mod Configuration, Know your Skyrim) sets the same switches and keeps them in
; Data/MCM/Settings/KnowYourSkyrim.ini, which wins over this file

[Cheats]
; 1 puts cheat buttons into the details of the browser: TAKE gives you the item, as many as the box beside it says,
; KILL kills a unique person or creature, essential ones too, RESURRECT brings a dead one back. 0 for none.
; HESOYAM typed into the game's console switches them on, typed again off
bEnabled=0

[Progression]
; 1 shows in the browser only what this character has met: quests in the journal, places found, people met, things held
; or seen in a chest, a shop or at a station, things the player could make. What was met is kept all the time, the
; switch can go on and off in the middle of a game. 0 shows everything
bEnabled=0

[Mods]
; The browser finds the mods that only change textures in the profile Mod Organizer 2 runs the game with, in what
; Vortex deployed and in archives. When it can't find Mod Organizer by itself, the folder of its instance goes here
; (the one with ModOrganizer.ini). Blank finds it by itself
sModOrganizer=
